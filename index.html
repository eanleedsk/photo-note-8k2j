<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>AI 사진 메모</title>
<style>
  :root {
    --bg-top: #eef0fb;
    --bg-bottom: #f7f4fd;
    --card: #ffffff;
    --primary: #4f46e5;
    --primary-dark: #4338ca;
    --accent: #9333ea;
    --text: #1b1e2b;
    --muted: #8083a0;
    --border: #ecedf6;
    --danger: #dc2626;
    --success: #16a34a;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    height: 100%;
  }
  body {
    margin: 0;
    padding: 0;
    background: linear-gradient(180deg, var(--bg-top) 0%, var(--bg-bottom) 55%);
    font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    color: var(--text);
    -webkit-font-smoothing: antialiased;
  }
  .wrap {
    max-width: 440px;
    margin: 0 auto;
    min-height: 100vh;
    padding: max(28px, env(safe-area-inset-top)) 20px calc(40px + env(safe-area-inset-bottom));
    display: flex;
    flex-direction: column;
  }
  header {
    text-align: center;
    margin-bottom: 28px;
  }
  header .logo {
    width: 58px;
    height: 58px;
    margin: 0 auto 14px;
    border-radius: 16px;
    background: linear-gradient(135deg, var(--primary), var(--accent));
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 8px 20px rgba(79, 70, 229, 0.28);
  }
  header .logo svg { width: 28px; height: 28px; }
  header h1 {
    font-size: 19px;
    font-weight: 700;
    margin: 0;
    letter-spacing: -0.2px;
  }
  header p {
    color: var(--muted);
    font-size: 13px;
    margin: 6px 0 0;
    line-height: 1.5;
  }

  main { flex: 1; display: flex; flex-direction: column; }

  .card {
    background: var(--card);
    border-radius: 20px;
    padding: 26px 22px;
    box-shadow: 0 10px 30px rgba(30, 30, 70, 0.06);
    border: 1px solid rgba(255,255,255,0.6);
  }
  .hidden { display: none !important; }
  .fade-in { animation: fadeIn 0.25s ease; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

  /* ---- 로그인 화면 ---- */
  #loginScreen { margin: auto 0; text-align: center; }
  #loginScreen .login-title {
    font-size: 15px;
    font-weight: 700;
    margin-bottom: 6px;
  }
  #loginScreen .login-sub {
    font-size: 13px;
    color: var(--muted);
    margin-bottom: 22px;
    line-height: 1.6;
  }
  .btn-kakao {
    width: 100%;
    padding: 15px;
    background: #FEE500;
    color: #191919;
    font-size: 15.5px;
    font-weight: 700;
    border-radius: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }
  .btn-kakao:active { transform: scale(0.97); }
  .btn-kakao svg { width: 20px; height: 20px; }
  .user-badge {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: #f4f5fc;
    border-radius: 12px;
    padding: 10px 14px;
    margin-bottom: 14px;
    font-size: 12.5px;
    color: var(--muted);
  }
  .user-badge a { color: var(--primary-dark); font-weight: 600; text-decoration: none; }

  button { font-family: inherit; cursor: pointer; border: none; }
  .btn-primary {
    width: 100%;
    padding: 16px;
    background: linear-gradient(135deg, var(--primary), var(--accent));
    color: #fff;
    font-size: 15.5px;
    font-weight: 600;
    border-radius: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    box-shadow: 0 10px 20px rgba(79, 70, 229, 0.25);
    transition: transform 0.1s, opacity 0.15s;
  }
  .btn-primary:active { transform: scale(0.97); }
  .btn-primary:disabled { opacity: 0.5; box-shadow: none; }
  .btn-secondary {
    width: 100%;
    padding: 14px;
    background: #f2f2fb;
    color: var(--primary-dark);
    font-size: 14.5px;
    font-weight: 600;
    border-radius: 14px;
    margin-top: 10px;
    transition: transform 0.1s;
  }
  .btn-secondary:active { transform: scale(0.97); }

  /* ---- 촬영 화면 ---- */
  .camera-btn {
    width: 100%;
    padding: 46px 16px;
    border: 1.5px dashed #cfd2ef;
    border-radius: 18px;
    background: #f8f9ff;
    text-align: center;
    color: var(--primary-dark);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    transition: background 0.15s, border-color 0.15s;
  }
  .camera-btn:active { background: #f0f1ff; border-color: var(--primary); }
  .camera-btn .icon-circle {
    width: 56px;
    height: 56px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--primary), var(--accent));
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .camera-btn .icon-circle svg { width: 26px; height: 26px; }
  .camera-btn .label { font-size: 15px; font-weight: 600; }
  .camera-btn .sub { font-size: 12px; color: var(--muted); }

  .preview-frame {
    border-radius: 16px;
    overflow: hidden;
    margin-bottom: 16px;
    box-shadow: 0 6px 18px rgba(30,30,70,0.10);
    background: #eee;
  }
  #preview { width: 100%; display: block; }

  label.field-label {
    font-size: 12.5px;
    color: var(--muted);
    margin-bottom: 7px;
    display: block;
    font-weight: 600;
  }
  textarea {
    width: 100%;
    min-height: 58px;
    border: 1.5px solid var(--border);
    border-radius: 13px;
    padding: 12px 13px;
    font-size: 14px;
    font-family: inherit;
    resize: vertical;
    margin-bottom: 16px;
    background: #fafaff;
    transition: border-color 0.15s;
  }
  textarea:focus { outline: none; border-color: var(--primary); background: #fff; }

  /* ---- 상태 화면 ---- */
  .status { text-align: center; padding: 34px 6px 6px; }
  .status .spinner {
    width: 38px;
    height: 38px;
    border: 4px solid #e7e8f5;
    border-top-color: var(--primary);
    border-radius: 50%;
    margin: 0 auto 20px;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .status .icon-wrap {
    width: 64px;
    height: 64px;
    border-radius: 50%;
    margin: 0 auto 18px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .status .icon-wrap svg { width: 30px; height: 30px; }
  .status .icon-wrap.success { background: #e9f9ef; }
  .status .icon-wrap.error { background: #fdeceb; }
  .status h3 { margin: 0 0 8px; font-size: 16.5px; font-weight: 700; }
  .status p { color: var(--muted); font-size: 13px; margin: 0; line-height: 1.6; }

  .footer-note {
    text-align: center;
    color: #b3b5cc;
    font-size: 11px;
    margin-top: 26px;
    letter-spacing: 0.2px;
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M4 8.5C4 7.67 4.67 7 5.5 7H8L9 5.5H15L16 7H18.5C19.33 7 20 7.67 20 8.5V17.5C20 18.33 19.33 19 18.5 19H5.5C4.67 19 4 18.33 4 17.5V8.5Z" stroke="white" stroke-width="1.6" stroke-linejoin="round"/>
        <circle cx="12" cy="13" r="3.2" stroke="white" stroke-width="1.6"/>
      </svg>
    </div>
    <h1>AI 사진 메모</h1>
    <p>사진을 찍으면 AI가 정리해서<br>카카오톡으로 보내드려요</p>
  </header>

  <main>
    <!-- 1) 카카오 로그인 화면 -->
    <div id="loginScreen">
      <div class="card">
        <div class="login-title">먼저 카카오톡으로 로그인해주세요</div>
        <div class="login-sub">로그인하신 카카오 계정으로<br>분석 결과가 도착합니다.</div>
        <button class="btn-kakao" onclick="loginWithKakao()">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M12 3C6.5 3 2 6.5 2 10.8c0 2.7 1.8 5.1 4.5 6.5l-1.1 4c-.1.4.3.7.6.5l4.7-3.1c.4 0 .9.1 1.3.1 5.5 0 10-3.5 10-7.8C22 6.5 17.5 3 12 3z" fill="#191919"/></svg>
          카카오톡으로 로그인
        </button>
      </div>
    </div>

    <!-- 2) 메인 화면 -->
    <div id="mainScreen" class="hidden">
      <div class="user-badge">
        <span>카카오 계정으로 연결됨</span>
        <a href="#" onclick="logout(); return false;">다른 계정으로 전환</a>
      </div>
      <div class="card" id="captureArea">
        <input type="file" accept="image/*" capture="environment" id="fileInput" class="hidden">
        <button class="camera-btn" onclick="document.getElementById('fileInput').click()">
          <span class="icon-circle">
            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M4 8.5C4 7.67 4.67 7 5.5 7H8L9 5.5H15L16 7H18.5C19.33 7 20 7.67 20 8.5V17.5C20 18.33 19.33 19 18.5 19H5.5C4.67 19 4 18.33 4 17.5V8.5Z" stroke="white" stroke-width="1.6" stroke-linejoin="round"/>
              <circle cx="12" cy="13" r="3.2" stroke="white" stroke-width="1.6"/>
            </svg>
          </span>
          <span class="label">사진 촬영하기</span>
          <span class="sub">눌러서 카메라를 바로 열어요</span>
        </button>
      </div>

      <div id="previewArea" class="card hidden">
        <div class="preview-frame"><img id="preview" alt="미리보기"></div>
        <label class="field-label">메모 (선택사항)</label>
        <textarea id="noteInput" placeholder="예: 3층 회의실, 거래처 명함 등 참고할 내용을 적어주세요"></textarea>
        <button class="btn-primary" id="sendBtn" onclick="sendPhoto()">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M4 12L20 4L14 20L11 13L4 12Z" stroke="white" stroke-width="1.7" stroke-linejoin="round"/></svg>
          AI 분석 + 카톡으로 받기
        </button>
        <button class="btn-secondary" onclick="resetForm()">다시 찍기</button>
      </div>

      <div id="statusArea" class="card hidden status">
        <div id="statusSpinner" class="spinner"></div>
        <div id="statusIconWrap" class="icon-wrap hidden">
          <svg id="statusIconSvg" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"></svg>
        </div>
        <h3 id="statusTitle">전송 중이에요...</h3>
        <p id="statusText">잠시만 기다려주세요.</p>
        <button class="btn-secondary hidden" id="resetBtn" onclick="resetForm()" style="margin-top:20px;">새 사진 찍기</button>
      </div>
    </div>
  </main>

  <div class="footer-note">직원용 · AI 사진 메모</div>
</div>

<iframe name="uploadFrame" id="uploadFrame" style="display:none"></iframe>
<form id="uploadForm" method="POST" target="uploadFrame" style="display:none">
  <input type="hidden" name="session" id="f_session">
  <input type="hidden" name="image" id="f_image">
  <input type="hidden" name="mimeType" id="f_mimeType" value="image/jpeg">
  <input type="hidden" name="note" id="f_note">
</form>

<script>
  var EXEC_URL = 'https://script.google.com/macros/s/AKfycbz7MeYcMImhHO_UqJ3GjdM7wjjVnEy6kYQroy4pSpccqvD89ql1X04wnnzROPl_7Xz1/exec';
  var KAKAO_REST_KEY = '70a6c00e71420820dd2b1e044d597f9d';
  var MAX_WIDTH = 2200;
  var currentDataUrl = null;

  var ICONS = {
    success: '<path d="M5 13l4 4L19 7" stroke="#16a34a" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>',
    error: '<path d="M12 9v4M12 17h.01M10.3 3.9L2.7 17a1.7 1.7 0 001.5 2.5h15.6a1.7 1.7 0 001.5-2.5L13.7 3.9a1.7 1.7 0 00-3.4 0z" stroke="#dc2626" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>'
  };

  // ---- 로그인 ----
  function loginWithKakao() {
    var authUrl = 'https://kauth.kakao.com/oauth/authorize' +
      '?client_id=' + KAKAO_REST_KEY +
      '&redirect_uri=' + encodeURIComponent(EXEC_URL) +
      '&response_type=code' +
      '&scope=talk_message';
    location.href = authUrl;
  }

  function logout() {
    localStorage.removeItem('ai_photo_memo_session');
    location.reload();
  }

  document.addEventListener('DOMContentLoaded', function () {
    var params = new URLSearchParams(location.search);
    var sessionFromUrl = params.get('session');
    if (sessionFromUrl) {
      localStorage.setItem('ai_photo_memo_session', sessionFromUrl);
      history.replaceState({}, '', location.pathname);
    }
    if (localStorage.getItem('ai_photo_memo_session')) {
      showMain();
    }
  });

  function showMain() {
    document.getElementById('loginScreen').classList.add('hidden');
    var m = document.getElementById('mainScreen');
    m.classList.remove('hidden');
    m.classList.add('fade-in');
  }

  // ---- 사진 선택 및 리사이즈 ----
  document.getElementById('fileInput').addEventListener('change', function (e) {
    var file = e.target.files[0];
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function (ev) {
      var img = new Image();
      img.onload = function () {
        var scale = Math.min(1, MAX_WIDTH / img.width);
        var w = Math.round(img.width * scale);
        var h = Math.round(img.height * scale);
        var canvas = document.createElement('canvas');
        canvas.width = w;
        canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        currentDataUrl = canvas.toDataURL('image/jpeg', 0.92);
        document.getElementById('preview').src = currentDataUrl;
        document.getElementById('captureArea').classList.add('hidden');
        var p = document.getElementById('previewArea');
        p.classList.remove('hidden');
        p.classList.add('fade-in');
      };
      img.src = ev.target.result;
    };
    reader.readAsDataURL(file);
  });

  function resetForm() {
    currentDataUrl = null;
    document.getElementById('fileInput').value = '';
    document.getElementById('noteInput').value = '';
    document.getElementById('captureArea').classList.remove('hidden');
    document.getElementById('previewArea').classList.add('hidden');
    document.getElementById('statusArea').classList.add('hidden');
    document.getElementById('sendBtn').disabled = false;
  }

  function setStatusIcon(type) {
    var wrap = document.getElementById('statusIconWrap');
    var svg = document.getElementById('statusIconSvg');
    wrap.classList.remove('success', 'error');
    wrap.classList.add(type);
    svg.innerHTML = ICONS[type];
    wrap.classList.remove('hidden');
  }

  // ---- 전송 ----
  function sendPhoto() {
    if (!currentDataUrl) return;
    document.getElementById('sendBtn').disabled = true;
    document.getElementById('previewArea').classList.add('hidden');
    var statusArea = document.getElementById('statusArea');
    statusArea.classList.remove('hidden');
    statusArea.classList.add('fade-in');
    document.getElementById('statusSpinner').classList.remove('hidden');
    document.getElementById('statusIconWrap').classList.add('hidden');
    document.getElementById('statusTitle').textContent = '전송 중이에요...';
    document.getElementById('statusText').textContent = 'AI가 분석해서 곧 카카오톡으로 보내드릴게요.';
    document.getElementById('resetBtn').classList.add('hidden');

    document.getElementById('f_session').value = localStorage.getItem('ai_photo_memo_session') || '';
    document.getElementById('f_image').value = currentDataUrl;
    document.getElementById('f_note').value = document.getElementById('noteInput').value || '';

    var finished = false;
    function showSuccess() {
      if (finished) return;
      finished = true;
      document.getElementById('statusSpinner').classList.add('hidden');
      setStatusIcon('success');
      document.getElementById('statusTitle').textContent = '저장 접수 완료!';
      document.getElementById('statusText').textContent = '이 화면은 이제 닫으셔도 괜찮아요.\n잠시 후 카카오톡으로 도착해요.';
      document.getElementById('resetBtn').classList.remove('hidden');
    }
    function showError() {
      if (finished) return;
      finished = true;
      document.getElementById('statusSpinner').classList.add('hidden');
      setStatusIcon('error');
      document.getElementById('statusTitle').textContent = '전송 실패';
      document.getElementById('statusText').textContent = '인터넷 연결을 확인하고 다시 시도해주세요.';
      document.getElementById('resetBtn').classList.remove('hidden');
      document.getElementById('sendBtn').disabled = false;
    }

    var frame = document.getElementById('uploadFrame');
    frame.onload = showSuccess;
    setTimeout(function () { if (!finished) showSuccess(); }, 12000);

    var form = document.getElementById('uploadForm');
    form.action = EXEC_URL;
    try {
      form.submit();
    } catch (e) {
      showError();
    }
  }
</script>
</body>
</html>
