<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>AI 사진 메모</title>
<style>
  :root {
    --bg: #f4f5fb;
    --card: #ffffff;
    --primary: #4f46e5;
    --primary-dark: #4338ca;
    --accent: #9333ea;
    --text: #1f2333;
    --muted: #6b7280;
    --border: #e5e7eb;
    --danger: #dc2626;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    color: var(--text);
  }
  .wrap {
    max-width: 480px;
    margin: 0 auto;
    min-height: 100vh;
    padding: 24px 20px 60px;
  }
  header {
    text-align: center;
    margin-bottom: 24px;
  }
  header .logo {
    width: 64px;
    height: 64px;
    margin: 0 auto 10px;
    border-radius: 18px;
    background: linear-gradient(135deg, var(--primary), var(--accent));
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 30px;
  }
  header h1 {
    font-size: 20px;
    margin: 0;
  }
  header p {
    color: var(--muted);
    font-size: 13px;
    margin: 6px 0 0;
  }
  .card {
    background: var(--card);
    border-radius: 18px;
    padding: 22px;
    box-shadow: 0 4px 18px rgba(30, 30, 60, 0.06);
    margin-bottom: 16px;
  }
  .hidden { display: none !important; }

  /* PIN 화면 */
  #pinScreen input {
    width: 100%;
    font-size: 28px;
    letter-spacing: 14px;
    text-align: center;
    padding: 14px 0;
    border: 2px solid var(--border);
    border-radius: 12px;
    margin-bottom: 14px;
  }
  #pinError {
    color: var(--danger);
    font-size: 13px;
    text-align: center;
    margin-bottom: 10px;
  }

  button {
    font-family: inherit;
    cursor: pointer;
    border: none;
  }
  .btn-primary {
    width: 100%;
    padding: 16px;
    background: linear-gradient(135deg, var(--primary), var(--accent));
    color: #fff;
    font-size: 16px;
    font-weight: 600;
    border-radius: 14px;
  }
  .btn-primary:active { transform: scale(0.98); }
  .btn-primary:disabled { opacity: 0.55; }
  .btn-secondary {
    width: 100%;
    padding: 14px;
    background: #eef0fb;
    color: var(--primary-dark);
    font-size: 15px;
    font-weight: 600;
    border-radius: 14px;
    margin-top: 10px;
  }

  .camera-btn {
    width: 100%;
    padding: 40px 16px;
    border: 2px dashed #c7c9e8;
    border-radius: 16px;
    background: #f8f9ff;
    text-align: center;
    color: var(--primary-dark);
  }
  .camera-btn .icon { font-size: 40px; display: block; margin-bottom: 8px; }
  .camera-btn .sub { font-size: 12px; color: var(--muted); margin-top: 4px; }

  #preview {
    width: 100%;
    border-radius: 14px;
    margin-bottom: 14px;
    display: block;
  }
  textarea {
    width: 100%;
    min-height: 60px;
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 12px;
    font-size: 14px;
    font-family: inherit;
    resize: vertical;
    margin-bottom: 14px;
  }
  label.field-label {
    font-size: 13px;
    color: var(--muted);
    margin-bottom: 6px;
    display: block;
  }

  .status {
    text-align: center;
    padding: 30px 10px;
  }
  .status .spinner {
    width: 34px;
    height: 34px;
    border: 4px solid #e5e7eb;
    border-top-color: var(--primary);
    border-radius: 50%;
    margin: 0 auto 16px;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .status .big-check {
    font-size: 44px;
    margin-bottom: 10px;
  }
  .status h3 { margin: 0 0 6px; font-size: 17px; }
  .status p { color: var(--muted); font-size: 13px; margin: 0; line-height: 1.6; }

  .footer-note {
    text-align: center;
    color: var(--muted);
    font-size: 11px;
    margin-top: 20px;
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo">📷</div>
    <h1>AI 사진 메모</h1>
    <p>사진을 찍으면 AI가 정리해서 카카오톡으로 보내드려요</p>
  </header>

  <!-- 1) PIN 입력 화면 -->
  <div id="pinScreen" class="card">
    <label class="field-label">비밀번호 4자리</label>
    <input type="tel" id="pinInput" maxlength="4" inputmode="numeric" placeholder="••••" autofocus>
    <div id="pinError" class="hidden">비밀번호가 틀렸어요. 다시 입력해주세요.</div>
    <button class="btn-primary" onclick="checkPin()">확인</button>
  </div>

  <!-- 2) 메인 화면 -->
  <div id="mainScreen" class="card hidden">
    <div id="captureArea">
      <input type="file" accept="image/*" capture="environment" id="fileInput" class="hidden">
      <button class="camera-btn" onclick="document.getElementById('fileInput').click()">
        <span class="icon">📸</span>
        사진 촬영하기
        <div class="sub">눌러서 카메라를 바로 여세요</div>
      </button>
    </div>

    <div id="previewArea" class="hidden">
      <img id="preview" alt="미리보기">
      <label class="field-label">메모 (선택사항)</label>
      <textarea id="noteInput" placeholder="예: 3층 회의실, 거래처 명함 등 참고할 내용을 적어주세요"></textarea>
      <button class="btn-primary" id="sendBtn" onclick="sendPhoto()">AI 분석 + 카톡으로 받기</button>
      <button class="btn-secondary" onclick="resetForm()">다시 찍기</button>
    </div>

    <div id="statusArea" class="hidden status">
      <div id="statusSpinner" class="spinner"></div>
      <div id="statusIcon" class="big-check hidden">✅</div>
      <h3 id="statusTitle">전송 중이에요...</h3>
      <p id="statusText">잠시만 기다려주세요.</p>
      <button class="btn-secondary hidden" id="resetBtn" onclick="resetForm()">새 사진 찍기</button>
    </div>
  </div>

  <div class="footer-note">사장님 전용 · AI 사진 메모</div>
</div>

<script>
  var EXEC_URL = 'https://script.google.com/macros/s/AKfycbz7MeYcMImhHO_UqJ3GjdM7wjjVnEy6kYQroy4pSpccqvD89ql1X04wnnzROPl_7Xz1/exec';
  var SHARED_SECRET = '73b99c81f081286678545a37d5544672';
  var CORRECT_PIN = '0817';
  var MAX_WIDTH = 1600;
  var currentDataUrl = null;

  // ---- PIN 화면 ----
  function checkPin() {
    var val = document.getElementById('pinInput').value.trim();
    if (val === CORRECT_PIN) {
      localStorage.setItem('ai_photo_memo_pin_ok', 'yes');
      showMain();
    } else {
      document.getElementById('pinError').classList.remove('hidden');
    }
  }
  document.addEventListener('DOMContentLoaded', function () {
    document.getElementById('pinInput').addEventListener('keydown', function (e) {
      if (e.key === 'Enter') checkPin();
    });
    if (localStorage.getItem('ai_photo_memo_pin_ok') === 'yes') {
      showMain();
    }
  });
  function showMain() {
    document.getElementById('pinScreen').classList.add('hidden');
    document.getElementById('mainScreen').classList.remove('hidden');
  }

  // ---- 사진 선택 및 리사이즈 ----
  document.getElementById('fileInput').addEventListener('change', function (e) {
    var file = e.target.files[0];
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function (ev) {
      var img = new Image();
      img.onload = function () {
        var scale = Math.min(1, MAX_WIDTH / img.width);
        var w = Math.round(img.width * scale);
        var h = Math.round(img.height * scale);
        var canvas = document.createElement('canvas');
        canvas.width = w;
        canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        currentDataUrl = canvas.toDataURL('image/jpeg', 0.82);
        document.getElementById('preview').src = currentDataUrl;
        document.getElementById('captureArea').classList.add('hidden');
        document.getElementById('previewArea').classList.remove('hidden');
      };
      img.src = ev.target.result;
    };
    reader.readAsDataURL(file);
  });

  function resetForm() {
    currentDataUrl = null;
    document.getElementById('fileInput').value = '';
    document.getElementById('noteInput').value = '';
    document.getElementById('captureArea').classList.remove('hidden');
    document.getElementById('previewArea').classList.remove('hidden');
    document.getElementById('previewArea').classList.add('hidden');
    document.getElementById('statusArea').classList.add('hidden');
    document.getElementById('sendBtn').disabled = false;
  }

  // ---- 전송 ----
  function sendPhoto() {
    if (!currentDataUrl) return;
    document.getElementById('sendBtn').disabled = true;
    document.getElementById('previewArea').classList.add('hidden');
    document.getElementById('statusArea').classList.remove('hidden');
    document.getElementById('statusSpinner').classList.remove('hidden');
    document.getElementById('statusIcon').classList.add('hidden');
    document.getElementById('statusTitle').textContent = '전송 중이에요...';
    document.getElementById('statusText').textContent = 'AI가 분석해서 곧 카카오톡으로 보내드릴게요.';
    document.getElementById('resetBtn').classList.add('hidden');

    var payload = {
      secret: SHARED_SECRET,
      image: currentDataUrl,
      mimeType: 'image/jpeg',
      note: document.getElementById('noteInput').value || ''
    };

    fetch(EXEC_URL, {
      method: 'POST',
      mode: 'no-cors',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(payload)
    }).then(function () {
      document.getElementById('statusSpinner').classList.add('hidden');
      document.getElementById('statusIcon').classList.remove('hidden');
      document.getElementById('statusTitle').textContent = '전송 완료!';
      document.getElementById('statusText').textContent = '10~20초 후 카카오톡 "나와의 채팅"으로 정리된 내용이 도착해요.';
      document.getElementById('resetBtn').classList.remove('hidden');
    }).catch(function () {
      document.getElementById('statusSpinner').classList.add('hidden');
      document.getElementById('statusIcon').textContent = '⚠️';
      document.getElementById('statusIcon').classList.remove('hidden');
      document.getElementById('statusTitle').textContent = '전송 실패';
      document.getElementById('statusText').textContent = '인터넷 연결을 확인하고 다시 시도해주세요.';
      document.getElementById('resetBtn').classList.remove('hidden');
      document.getElementById('sendBtn').disabled = false;
    });
  }
</script>
</body>
</html>
